name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip

      - name: Build debug APK
        run: ./gradle-8.10.2/bin/gradle assembleDebug --no-daemon

      - name: Copy APK to repository
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Dzikir-Harian-Wajib.apk

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Dzikir-Harian-Wajib.apk
          git commit -m "Update APK" || echo "No APK changes to commit"
          git push
